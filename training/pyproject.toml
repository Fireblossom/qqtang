[project]
name = "qqtrain"
version = "0.1.0"
description = "Reinforcement-learning training stack for the QQTang battle policy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "numpy>=2.1,<3",
    "onnx>=1.19,<2",
    "onnxruntime>=1.23,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qqtrain"]

# PyPI's Linux torch wheels are built against CUDA 13 since 2.11. The H100
# node uses the CUDA 12.6 build from the PyTorch index instead; macOS keeps
# the PyPI wheel (CPU/MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
