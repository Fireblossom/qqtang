# One H100 80GB plus the CPU cores of its 42-cluster container (Linux x86-64).
#   cd /mlde/qqtang-rl/repo/training
#   uv run python -m qqtrain.train --config configs/h100.toml --set run.dir=/mlde/qqtang-rl/runs/h100-001
# scripts/cluster_run.sh does this under tmux/nohup and sets worker.num_workers
# to min(config, (nproc - 4) / 4) (each worker runs GOMAXPROCS=4).
#
# Sizing (re-check on the first real run; see README "Trainer"):
# * Worker throughput (R1, Apple M4 Max, 16 cores, f16): one process is bound by its
#   stdout pipe at ~57k decisions/s; 4 / 8 processes with GOMAXPROCS 4 / 2 deliver
#   100k-125k decisions/s into one Python reader. Each env step ships 182 KB
#   (4 f16 slots, empty slots of 2-player episodes included), so the observation
#   stream into the trainer process, not the core count, caps useful workers.
#   -> 8 workers x GOMAXPROCS 4 (32 cores; cluster_run.sh caps the count at
#   (nproc - 4) / 4), 64 envs each = 512 envs, 2048 slots, 2 pipelining groups.
# * Decision cadence "server" (what the deployed model experiences): ~1 in 5
#   decisions comes early, a STEP advances each env 1-5 ticks and only due agents
#   act; random_phase adds the server's per-player start phase. The trainer
#   discounts by elapsed time (gamma per 100 ms).
# * Rollout T=128 STEPs: ~65k env steps, ~125k learner samples (~2.6 agents per
#   env, ~75 % learner-controlled; fewer active slots per STEP with the server
#   cadence). Storage on the GPU: 130 x 2048 x 45.6 KB = 12 GB f16 observations
#   + 0.4 GB scalars/memory.
# * PPO: 3 epochs x 8 minibatches of ~16k samples (~500 chunks x 32 decisions). The
#   3.2M-parameter U2392 net (~170 MFLOP fwd+bwd per sample) needs roughly 0.5-1 MB
#   of bf16 activations per sample, i.e. <=16 GB per minibatch. README "Model"
#   estimates 80k-200k training samples/s on the H100 -> 3 epochs of 125k samples
#   take ~2-5 s, about the rollout time at ~100k decisions/s. If the update
#   dominates, lower ppo.epochs or try model.compile = true; if the workers do,
#   add workers (bandwidth permitting).
# * Horizon: gamma 0.995 per 100 ms = ~20 s effective horizon; GAE lambda 0.95.

[run]
dir = "/mlde/qqtang-rl/runs/h100"
seed = 1
device = "cuda"
total_agent_steps = 3_000_000_000
checkpoint_every = 25
keep_checkpoints = 4
resume = "auto"
tensorboard = false

[worker]
command = ["bin/qqt-train-worker-{platform}"]
client_root = "/mlde/qqtang-rl/qqtang-local/runtime/client-patched"
num_workers = 8
groups = 2
step_timeout_s = 120.0
max_restarts = 50

[worker.env]
GOMAXPROCS = "4"

# Opaque: passed to the worker as JSON (schema: cmd/qqt-train-worker/config.go).
[worker.config]
envs = 64
agents = 4
player_counts = [2, 2, 4]
team_count = 2
spatial_dtype = "f16"
workers = 0                  # goroutines = GOMAXPROCS
decision_cadence = "server"  # "fixed" = the spec's 100 ms STEP
random_phase = true

[model]
factory = "qqtrain.model"
init_from_baseline = true
compile = false

[baseline]
onnx = "../configs/models/qqtang-rule1.onnx"

[ppo]
rollout_steps = 128
seq_len = 32
epochs = 3
minibatches = 8
gamma = 0.995
gae_lambda = 0.95
clip = 0.2
value_clip = 0.2
value_coef = 0.5
entropy_coef = 0.01
entropy_coef_final = 0.002
target_kl = 0.03
max_grad_norm = 0.5
lr = 2.5e-4
lr_final = 2.5e-5
lr_warmup_updates = 20
lr_schedule = "cosine"
value_warmup_updates = 30
bf16 = true
tf32 = true
storage_device = "auto"

[league]
self_play_prob = 0.5
train_both_sides = true
baseline_prob = 0.3
snapshot_every = 25
max_snapshots = 30
resident = 4
pfsp_power = 2.0
opponent_min_p = 0.1
opponent_temperature = 1.0

[eval]
every = 100
num_workers = 8
episodes = 256
seed = 777
min_p = 0.1
temperature = 1.0
opponents = ["baseline", "snapshots:2"]
export_best = true

# Opaque worker-config overrides per evaluation mode (no curricula).
[eval.modes.1v1.worker_config]
envs = 32
player_counts = [2]

[eval.modes.2v2.worker_config]
envs = 32
player_counts = [4]
